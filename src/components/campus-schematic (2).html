<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Campus Schematic Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --ink:#e6eefc; --dim:#8194bd; --dimmer:#5b6d95;
  --pwr:#4f8bff; --pwr-soft:#3a6fe6; --cool:#2fdbe6; --net:#a48bff;
  --line:#274680; --line-soft:#1c3a6e;
}
*{box-sizing:border-box}
html,body{margin:0;background:
   radial-gradient(1200px 800px at 50% -8%, #0a1428 0%, #05070f 60%, #03040a 100%);
  color:var(--ink);
  font-family:"JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono",
              "Roboto Mono", Menlo, Consolas, monospace;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px;}
.stage-shell{width:100%;}
.svgscroll{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
svg.schematic{width:100%;height:auto;display:block;}

/* ---------- frame ---------- */
.frame{fill:none;stroke:rgba(93,140,230,.34);stroke-width:1.4;
       filter:drop-shadow(0 0 22px rgba(40,90,200,.14));}
.tick{fill:none;stroke:rgba(120,165,255,.55);stroke-width:1.6;stroke-linecap:round;}

/* ---------- rails ---------- */
.rail-label{font-size:14px;font-weight:600;letter-spacing:3px;}
.rail-label.pwr{fill:#7ea8ff;} .rail-label.cool{fill:#5fe6ec;} .rail-label.net{fill:#b7a6ff;}
.rail{stroke-width:2;fill:none;stroke-linecap:round;}
.rail-pwr{stroke:rgba(79,139,255,.5);}
.rail-cool{stroke:rgba(47,219,230,.42);}
.rail-net{stroke:rgba(164,139,255,.5);stroke-dasharray:2 7;}
.rung{stroke:rgba(79,139,255,.22);stroke-width:1.4;}
.rung.tap{stroke:rgba(79,139,255,.14);}
.rnode{fill:#0a1220;stroke-width:1.6;transition:filter .5s ease, fill .5s ease;}
.rnode-pwr{stroke:#4f8bff;} .rnode-cool{stroke:#2fdbe6;} .rnode-net{stroke:#a48bff;}

/* ---------- flow lines ---------- */
.flow{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.flow-pwr{stroke:url(#pwrGrad);}
.flow-net{stroke:rgba(164,139,255,.55);stroke-width:1.8;stroke-dasharray:4 7;}
.jnode{fill:#0a1220;stroke:#4f8bff;stroke-width:1.8;transition:filter .5s;}
.spine-layer .flow{stroke:var(--pwr);}

/* JS present: flows start hidden until activated */
.js .flow{stroke-dashoffset:var(--len);transition:stroke-dashoffset .72s cubic-bezier(.4,0,.2,1);}
.js .flow.on{stroke-dashoffset:0;}
.flow.on{filter:drop-shadow(0 0 6px rgba(79,139,255,.75));}
.flow-net.on{filter:drop-shadow(0 0 6px rgba(164,139,255,.7));}

/* NET rail tap into the fabric (subdued, lights up with the skid) */
.nettap{stroke:rgba(164,139,255,.26);stroke-width:1.8;fill:none;
        stroke-dasharray:4 7;stroke-linecap:round;transition:stroke .5s ease;}
.nettap.on{stroke:rgba(164,139,255,.72);
        filter:drop-shadow(0 0 6px rgba(164,139,255,.7));
        animation:march 1.1s linear infinite;}

/* ---------- lattice (planned) ---------- */
.lattice{stroke:rgba(120,140,185,.28);stroke-width:1.5;fill:none;
         stroke-dasharray:5 6;stroke-linecap:round;transition:stroke .6s ease;}
.lattice-layer.on .lattice{stroke:rgba(150,140,220,.5);animation:march 1.1s linear infinite;}
@keyframes march{to{stroke-dashoffset:-22;}}

/* ---------- cards ---------- */
.card{transition:opacity .6s ease;}
.card-bg{fill:rgba(15,26,52,.42);}
.card-border{fill:none;stroke:rgba(83,125,210,.28);stroke-width:1.3;
             transition:stroke .55s ease, filter .55s ease;}
.card-accent{fill:rgba(79,139,255,.35);transition:fill .55s ease, filter .55s ease;}
.card-title{font-size:23px;font-weight:700;letter-spacing:1.2px;fill:#eaf1ff;
            transition:fill .5s ease;}
.card-sub{font-size:13.5px;font-weight:400;letter-spacing:1.6px;fill:#7688b0;
          transition:fill .5s ease;}

/* icons */
.icon-chip{fill:rgba(46,84,170,.12);stroke:rgba(90,140,240,.4);stroke-width:1.2;
           transition:stroke .5s, filter .5s;}
.icon-chip.cool{stroke:rgba(47,219,230,.42);}
.ic-fill{fill:#79a6ff;transition:fill .5s, filter .5s;}
.ic-fill-cool{fill:#4fe3ea;}
.ic-stroke{fill:none;stroke:#7ba4ff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.ic-stroke.thin{stroke-width:1.1;stroke-opacity:.75;}
.ic-stroke-rect{fill:none;stroke:#7ba4ff;stroke-width:1.5;}
.ic-row{fill:rgba(120,165,255,.16);}
.ic-dot{fill:#6fa2ff;}
.icon-glyph.cool .ic-stroke{stroke:#4fe3ea;}
.icon-glyph{transition:filter .5s ease;}

/* pods */
.pod-bg{fill:rgba(17,30,60,.5);}
.pod-border{stroke:rgba(95,140,235,.4);}
.pod-accent{fill:#5b93ff;filter:drop-shadow(0 0 6px rgba(79,139,255,.6));
            transition:filter .5s ease, fill .5s ease;}
.pod-title{font-size:28px;font-weight:700;letter-spacing:.5px;fill:#eef3ff;}
.pod-sub{font-size:12.5px;letter-spacing:1px;fill:#8496bd;}
.pod-tag{font-size:12px;letter-spacing:2px;fill:#6f9bff;font-weight:500;}
.pod-rack .ic-dot{fill:#6fa2ff;}

/* planned pods */
.planned{opacity:.5;}
.planned-bg{fill:rgba(20,28,48,.28);}
.planned-border{fill:none;stroke:rgba(120,140,180,.42);stroke-width:1.3;stroke-dasharray:6 6;}
.planned-title{font-size:15px;letter-spacing:2px;fill:#7182a4;font-weight:500;}
.planned-sub{font-size:12.5px;letter-spacing:1.6px;fill:#586a8f;}

/* skid */
.skid-bg{fill:rgba(24,20,52,.42);}
.skid-border{stroke:rgba(150,128,240,.4);}
.skid-accent{fill:rgba(164,139,255,.45);}
.ic-stroke-net{stroke:#b6a4ff;stroke-width:1.7;fill:none;stroke-linecap:round;}
.ic-node-net{fill:#0a1220;stroke:#b6a4ff;stroke-width:1.6;}
.icon-glyph.net{transition:filter .5s ease;}

/* badges */
.badge{fill:rgba(40,70,150,.14);stroke-width:1.2;}
.badge-shared{stroke:rgba(96,144,244,.62);}
.badge-fabric{stroke:rgba(168,132,255,.66);fill:rgba(70,45,140,.16);}
.badge-text{font-size:12.5px;letter-spacing:2.5px;font-weight:600;}
.badge-shared-t{fill:#83abff;} .badge-fabric-t{fill:#bda6ff;}

/* ---------- bottom bar ---------- */
.bb-bg{fill:rgba(13,22,44,.5);}
.bb-border{fill:none;stroke:rgba(83,125,210,.24);stroke-width:1.2;}
.bb-divider{stroke:rgba(90,120,180,.28);stroke-width:1.2;}
.bb-text{font-size:13.5px;letter-spacing:1.3px;fill:#9fb0d4;font-weight:500;}
.bb-ic-stroke{stroke:#7ea8ff;stroke-width:1.6;stroke-linecap:round;}
.bb-ic-node{fill:#7ea8ff;}
.bb-ic-fill{fill:#7ea8ff;}
.bb-ic-rect{fill:none;stroke:#7ea8ff;stroke-width:1.4;}
.bb-ic-line{stroke:rgba(126,168,255,.6);stroke-width:1.2;}
.bb-ic-dot{fill:#7ea8ff;}

/* =====================================================
   ACTIVE STATES (added progressively by JS)
   ===================================================== */
.js .card:not(.active) .card-border{stroke:rgba(70,100,165,.2);}
.js .card.dim{opacity:.4;}
.js .card.dim .card-title{fill:#63739a;}
.js .card.dim .card-sub{fill:#4d5c7e;}

.card.active .card-border{stroke:rgba(110,160,255,.85);
   filter:drop-shadow(0 0 12px rgba(70,120,240,.45));}
.card.active .card-title{fill:#ffffff;}
.card.active .card-sub{fill:#93a6cd;}
.card.active .card-accent{fill:#5b93ff;filter:drop-shadow(0 0 7px rgba(79,139,255,.8));}
.card.active .icon-chip{stroke:rgba(120,165,255,.85);filter:drop-shadow(0 0 8px rgba(70,120,240,.5));}
.card.active .icon-glyph{filter:drop-shadow(0 0 6px rgba(90,150,255,.7));}
.card.active .ic-fill{fill:#a9c6ff;}
.card.active{animation:breathe 3.4s ease-in-out infinite;}

/* cooling active -> cyan emphasis */
#card-cooling.active .card-border{stroke:rgba(70,220,235,.7);
   filter:drop-shadow(0 0 12px rgba(40,200,220,.4));}
#card-cooling.active .icon-glyph{filter:drop-shadow(0 0 7px rgba(60,220,235,.75));}

/* skid active -> violet emphasis */
#card-skid.active .card-border{stroke:rgba(175,140,255,.85);
   filter:drop-shadow(0 0 14px rgba(150,110,255,.5));}
#card-skid.active .icon-glyph.net{filter:drop-shadow(0 0 8px rgba(175,140,255,.8));}
#card-skid.active .skid-accent{fill:#b49bff;filter:drop-shadow(0 0 7px rgba(164,139,255,.85));}

/* pods active */
.pod.active .pod-border{stroke:rgba(120,165,255,.95);
   filter:drop-shadow(0 0 14px rgba(70,120,240,.5));}
.pod.active .pod-accent{fill:#79abff;filter:drop-shadow(0 0 9px rgba(90,150,255,.9));}
.pod.active .pod-rack{filter:drop-shadow(0 0 7px rgba(90,150,255,.7));}
.pod.active .pod-rack .ic-dot{fill:#a9c6ff;}
.pod.active .pod-title{fill:#ffffff;}
.pod.active{animation:breathe 3.4s ease-in-out infinite;}
.js .pod.dim{opacity:.42;}

/* rail nodes active */
.rnode.on{fill:#0e1830;}
.rnode-pwr.on{filter:drop-shadow(0 0 6px rgba(79,139,255,.9));fill:#1a2f5c;}
.rnode-cool.on{filter:drop-shadow(0 0 6px rgba(47,219,230,.85));fill:#0c3138;}
.rnode-net.on{filter:drop-shadow(0 0 6px rgba(164,139,255,.85));fill:#1e1745;}
.jnode.on{filter:drop-shadow(0 0 7px rgba(79,139,255,.9));fill:#1a2f5c;}

@keyframes breathe{
  0%,100%{filter:drop-shadow(0 0 4px rgba(70,120,240,.18));}
  50%{filter:drop-shadow(0 0 12px rgba(80,140,255,.4));}
}

/* ---------- hover emphasis ---------- */
.card:hover .card-border, .pod:hover .pod-border{
  stroke:rgba(150,190,255,.95);
  filter:drop-shadow(0 0 16px rgba(90,140,255,.55));}
.card:hover, .pod:hover{cursor:default;}
.pod.hl .drop-hl{stroke-opacity:1;}

/* ---------- caption ---------- */
.cap{margin:18px auto 0;max-width:900px;text-align:center;
     font-size:12.5px;letter-spacing:2px;color:#54658c;}
.cap b{color:#8fa4cc;font-weight:600;}

@media (prefers-reduced-motion: reduce){
  .card.active, .pod.active{animation:none!important;}
  .lattice-layer.on .lattice{animation:none!important;}
  .js .flow{transition:none!important;}
}

@media (max-width:760px){
  .wrap{padding:16px 10px 32px;}
  .svgscroll{overflow-x:auto;}
  svg.schematic{min-width:680px;}
  .cap{font-size:11px;padding:0 8px;}
}
</style>
</head>

<script>
(function(){
  var root = document.documentElement;
  root.classList.add('js');
  var svg = document.querySelector('svg.schematic');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cards = ['card-utility','card-substation','card-cooling','card-control'];
  var pods  = ['pod-01','pod-02','pod-03'];
  var planned = ['plan-04','plan-05','plan-06'];
  var lattice = document.querySelector('.lattice-layer');

  function $(id){ return document.getElementById(id); }
  function on(el){ if(el) el.classList.add('on'); }
  function off(el){ if(el) el.classList.remove('on'); }
  function act(el){ if(el){ el.classList.add('active'); el.classList.remove('dim'); } }

  function railOn(key){
    on($('rn-'+key+'-pwr')); on($('rn-'+key+'-cool')); on($('rn-'+key+'-net'));
  }

  function dimAll(){
    cards.concat(pods, ['card-skid']).forEach(function(id){
      var e=$(id); if(e){ e.classList.add('dim'); e.classList.remove('active'); }
    });
    document.querySelectorAll('.flow, .nettap').forEach(function(e){ e.classList.remove('on'); });
    document.querySelectorAll('.rnode,.jnode').forEach(function(e){ e.classList.remove('on'); });
    if(lattice) lattice.classList.remove('on');
  }

  function finalState(){
    // everything visible & active (used for reduced-motion / no animation)
    cards.concat(pods).forEach(function(id){ act($(id)); });
    act($('card-skid'));
    document.querySelectorAll('.flow').forEach(function(e){ e.classList.add('on'); });
    document.querySelectorAll('.rnode,.jnode').forEach(function(e){ e.classList.add('on'); });
    if(lattice) lattice.classList.add('on');
  }

  // ---- staged timeline ----
  var steps = [
    function(){ act($('card-utility'));    railOn('utility'); },
    function(){ on($('seg1')); },
    function(){ act($('card-substation')); railOn('substation'); },
    function(){ on($('seg2')); },
    function(){ act($('card-cooling'));    railOn('cooling'); },
    function(){ on($('seg3')); },
    function(){ act($('card-control'));    railOn('control'); },
    function(){ on($('seg-branch-down')); on($('jnode-branch')); },
    function(){ on($('seg-bus')); on($('drop-1')); on($('drop-2')); on($('drop-3')); },
    function(){ act($('pod-01')); },
    function(){ act($('pod-02')); },
    function(){ act($('pod-03')); },
    function(){ if(lattice) lattice.classList.add('on'); },
    function(){ act($('card-skid')); on($('net-tap')); on($('rn-skid-net')); }
  ];

  var STEP_MS = 620;
  var HOLD_MS = 2600;
  var idx = 0, timer = null;

  function tick(){
    if(idx < steps.length){
      steps[idx](); idx++;
      timer = setTimeout(tick, STEP_MS);
    } else {
      timer = setTimeout(function(){
        dimAll();
        idx = 0;
        timer = setTimeout(tick, 700);
      }, HOLD_MS);
    }
  }

  function start(){ dimAll(); idx=0; timer=setTimeout(tick, 500); }

  // pod hover -> highlight its drop connector
  pods.forEach(function(id, i){
    var el = $(id);
    if(!el) return;
    el.addEventListener('mouseenter', function(){
      var d = $('drop-'+(i+1)); if(d) d.style.filter='drop-shadow(0 0 8px rgba(120,170,255,.95))';
    });
    el.addEventListener('mouseleave', function(){
      var d = $('drop-'+(i+1)); if(d) d.style.filter='';
    });
  });

  if(reduce){ finalState(); return; }

  // Only animate when in view (perf + it plays when the user sees it)
  var started=false;
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting && !started){ started=true; start(); }
      });
    }, {threshold:.25});
    io.observe(svg);
  } else { started=true; start(); }
})();
</script>
