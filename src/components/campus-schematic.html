<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Schematic — Modular Data Center</title>
<style>
  /* ============================================================
     CAMPUS SCHEMATIC — premium technical visualization
     Self-contained. No external dependencies. No build step.
     Swap points for Michael:
       --net  = network color (placeholder violet; set to your HTML's network color)
       CAPTIONS object in <script> = replace with your original stage captions
  ============================================================ */
  :root{
    --bg:#050b14;
    --bg2:#0a1524;
    --ink:#e9f1fb;
    --ink-dim:#a7bcd8;
    --ink-mute:#5f77a0;
    --panel-edge:rgba(96,150,210,.30);
    --grid:rgba(90,130,180,.075);
    --grid-strong:rgba(90,130,180,.14);

    --power:#3f8efc;   --power-bright:#8bc0ff;  --power-glow:rgba(63,142,252,.55);
    --cool:#21d4ee;    --cool-bright:#96f0f9;   --cool-glow:rgba(33,212,238,.50);
    --net:#a78bfa;     --net-bright:#cbb9ff;    --net-glow:rgba(167,139,250,.55);

    --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #0d1a2e 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding:32px 20px 48px;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto}

  .frame{
    position:relative;
    border-radius:20px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .frame svg{display:block;width:100%;height:auto;min-width:900px}

  /* subtle edge fades hint horizontal pan on small screens */
  .frame::before,.frame::after{
    content:"";position:absolute;top:0;bottom:0;width:34px;pointer-events:none;z-index:2;
    opacity:0;transition:opacity .3s ease;
  }
  .frame::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
  .frame::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
  @media (max-width:940px){.frame::before,.frame::after{opacity:.9}}

  /* ---------- controls ---------- */
  .controls{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-top:22px;flex-wrap:wrap;
  }
  .btn{
    font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-dim);background:rgba(18,32,54,.6);
    border:1px solid var(--panel-edge);border-radius:999px;
    padding:9px 16px;cursor:pointer;transition:.2s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{color:var(--ink);border-color:rgba(120,180,255,.55);box-shadow:0 0 18px rgba(63,142,252,.22)}
  .btn:focus-visible{outline:2px solid var(--power);outline-offset:2px}
  .btn svg{width:12px;height:12px;fill:currentColor}

  .dots{display:flex;gap:9px;align-items:center;padding:0 4px}
  .dot{
    width:11px;height:11px;border-radius:50%;cursor:pointer;
    background:rgba(120,160,210,.18);border:1px solid rgba(120,160,210,.3);
    transition:.25s ease;padding:0;
  }
  .dot:hover{background:rgba(120,160,210,.4)}
  .dot.active{
    background:var(--power);border-color:var(--power-bright);
    box-shadow:0 0 12px var(--power-glow);transform:scale(1.15);
  }
  .dot:focus-visible{outline:2px solid var(--power);outline-offset:2px}

  .hint{
    text-align:center;margin-top:14px;font-family:var(--mono);
    font-size:11.5px;letter-spacing:1px;color:var(--ink-mute);
  }

  /* ============================================================
     SVG element styling
  ============================================================ */

  /* reveal system: elements with data-from are hidden until active */
  .rv{opacity:0;transition:opacity .6s ease, transform .6s ease}
  .rv.is-on{opacity:1}
  .lift{transform:translateY(12px)}
  .lift.is-on{transform:translateY(0)}

  /* text */
  .t-title{font-family:var(--mono);font-size:22px;letter-spacing:5px;fill:var(--ink-dim);font-weight:500}
  .t-stage{font-family:var(--mono);font-size:22px;letter-spacing:3px;fill:var(--ink);font-weight:600}
  .t-cardtitle{font-family:var(--sans);font-size:25px;letter-spacing:1.5px;fill:var(--ink);font-weight:700}
  .t-cardsub{font-family:var(--mono);font-size:14px;letter-spacing:1.4px;fill:var(--ink-mute)}
  .t-podtitle{font-family:var(--sans);font-size:29px;letter-spacing:1px;fill:var(--ink);font-weight:700}
  .t-itrow{font-family:var(--mono);font-size:15px;letter-spacing:2px;fill:var(--ink-mute)}
  .t-buslabel{font-family:var(--mono);font-size:15px;letter-spacing:2.5px;font-weight:600}
  .t-perim{font-family:var(--mono);font-size:12px;letter-spacing:3px;fill:var(--ink-mute)}
  .t-skidtitle{font-family:var(--sans);font-size:21px;letter-spacing:1.5px;fill:var(--ink);font-weight:700}
  .t-skidsub{font-family:var(--mono);font-size:13px;letter-spacing:1.4px;fill:var(--ink-mute)}
  .t-ghost{font-family:var(--sans);font-size:19px;letter-spacing:2px;fill:rgba(150,175,210,.42);font-weight:600}
  .t-ghostsub{font-family:var(--mono);font-size:12px;letter-spacing:2px;fill:rgba(120,150,190,.32)}
  .t-cap{font-family:var(--mono);font-size:20px;letter-spacing:1.4px;fill:var(--ink-dim)}

  /* cards */
  .card-bg{fill:rgba(16,30,52,.55);stroke:var(--panel-edge);stroke-width:1.3}
  .card-inner{fill:none;stroke:rgba(120,170,225,.12);stroke-width:1}
  .icon-box{fill:rgba(10,22,40,.6);stroke-width:1.3}
  .icon-box.pw{stroke:rgba(63,142,252,.55)}
  .icon-box.cl{stroke:rgba(33,212,238,.5)}
  .icon-box.nt{stroke:rgba(167,139,250,.5)}

  .card.pw{filter:drop-shadow(0 0 0 transparent)}
  .card.pw.is-on{filter:drop-shadow(0 6px 22px rgba(63,142,252,.12))}
  .card.cl.is-on{filter:drop-shadow(0 6px 22px rgba(33,212,238,.10))}

  /* pods get an energized edge when active */
  .pod-bg{fill:rgba(14,28,50,.62);stroke:var(--panel-edge);stroke-width:1.3;transition:.6s ease}
  .pod.is-on .pod-bg{stroke:rgba(90,160,250,.55);filter:drop-shadow(0 0 26px rgba(63,142,252,.16))}
  .pod-inner{fill:none;stroke:rgba(120,170,225,.13);stroke-width:1}

  /* glyphs */
  .g-pw{stroke:var(--power);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .g-pw-fill{fill:var(--power)}
  .g-cl{stroke:var(--cool);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .g-nt{stroke:var(--net);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .g-nt-fill{fill:var(--net)}

  /* wires */
  .wire{transition:opacity .6s ease}
  .wire.pw .base{stroke:var(--power);stroke-width:3;stroke-opacity:.5;fill:none;filter:drop-shadow(0 0 4px var(--power-glow))}
  .wire.cl .base{stroke:var(--cool);stroke-width:2.6;stroke-opacity:.5;fill:none;stroke-dasharray:7 7;filter:drop-shadow(0 0 4px var(--cool-glow))}
  .wire.nt .base{stroke:var(--net);stroke-width:2.6;stroke-opacity:.55;fill:none;stroke-dasharray:6 8;filter:drop-shadow(0 0 4px var(--net-glow))}

  .flow{fill:none;stroke-linecap:round}
  .wire.pw .flow{stroke:var(--power-bright);stroke-width:3.2;stroke-dasharray:5 95;filter:drop-shadow(0 0 6px var(--power-glow))}
  .wire.cl .flow{stroke:var(--cool-bright);stroke-width:2.8;stroke-dasharray:5 95;filter:drop-shadow(0 0 6px var(--cool-glow))}
  .wire.nt .flow{stroke:var(--net-bright);stroke-width:2.8;stroke-dasharray:5 95;filter:drop-shadow(0 0 6px var(--net-glow))}
  .wire.is-on .flow{animation:flow 2.7s linear infinite}
  .wire.cl.is-on .flow{animation-duration:3.6s}
  .wire.nt.is-on .flow{animation-duration:2.3s}
  .flow.d2{animation-delay:-1.35s !important}
  @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}

  /* nodes */
  .node{transform-box:fill-box;transform-origin:center}
  .node .halo{opacity:.9}
  .node.pw .core{fill:var(--power-bright);filter:drop-shadow(0 0 6px var(--power-glow))}
  .node.pw .halo{fill:none;stroke:var(--power);stroke-width:1.5;stroke-opacity:.5}
  .node.cl .core{fill:var(--cool-bright);filter:drop-shadow(0 0 6px var(--cool-glow))}
  .node.cl .halo{fill:none;stroke:var(--cool);stroke-width:1.5;stroke-opacity:.5}
  .node.nt .core{fill:var(--net-bright);filter:drop-shadow(0 0 6px var(--net-glow))}
  .node.nt .halo{fill:none;stroke:var(--net);stroke-width:1.5;stroke-opacity:.5}
  .node.is-on{animation:nodePulse 3.2s ease-in-out infinite}
  @keyframes nodePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

  /* rack slots + status */
  .rack-box{fill:rgba(9,20,38,.7);stroke:var(--power);stroke-width:1.4;stroke-opacity:.7}
  .slot{fill:rgba(63,142,252,.10);stroke:rgba(63,142,252,.35);stroke-width:1;rx:3}
  .slot.lit{fill:rgba(63,142,252,.30);stroke:var(--power)}
  .status{fill:var(--power-bright)}
  .pod.is-on .status{animation:blink 1.9s ease-in-out infinite}
  .pod.is-on .status.s2{animation-delay:.5s}
  .pod.is-on .status.s3{animation-delay:1s}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.22}}

  .data-line{stroke:rgba(150,180,220,.22);stroke-width:2;stroke-linecap:round}
  .data-line.hi{stroke:rgba(120,190,255,.55)}

  /* progress dashes */
  .dash{fill:rgba(120,160,210,.20);transition:.4s ease}
  .dash.lit{fill:var(--power);filter:drop-shadow(0 0 6px var(--power-glow))}

  /* perimeter + ghosts */
  .perim{fill:none;stroke:rgba(140,170,210,.28);stroke-width:1.4;stroke-dasharray:2 10;stroke-linecap:round;transition:.6s ease}
  .perim.emph{stroke:rgba(150,185,235,.55);filter:drop-shadow(0 0 14px rgba(63,142,252,.12))}
  .ghost-bg{fill:rgba(16,28,48,.30);stroke:rgba(130,160,200,.30);stroke-width:1.3;stroke-dasharray:7 6}
  .ghost-rack{fill:none;stroke:rgba(130,160,200,.28);stroke-width:1.3}

  .cap-box{fill:rgba(12,24,44,.4);stroke:rgba(120,160,210,.22);stroke-width:1.2;stroke-dasharray:3 7}

  .central-glow{fill:url(#coreGlow)}

  /* reduced motion: no pulses, show final state statically */
  @media (prefers-reduced-motion:reduce){
    .rv{transition:none}
    .wire.is-on .flow{animation:none}
    .flow{display:none}
    .wire .base{stroke-opacity:.8}
    .node.is-on{animation:none}
    .pod.is-on .status{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame">
    <svg id="schematic" viewBox="0 0 1400 1240" role="img"
         aria-label="Modular data center campus schematic with a seven stage build sequence"
         tabindex="0" data-stage="1">
      <defs>
        <pattern id="gridFine" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
        <pattern id="gridCoarse" width="160" height="160" patternUnits="userSpaceOnUse">
          <path d="M160 0H0V160" fill="none" stroke="var(--grid-strong)" stroke-width="1"/>
        </pattern>
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#12305a" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#12305a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="frameFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0a1626"/>
          <stop offset="100%" stop-color="#060d18"/>
        </linearGradient>
        <clipPath id="frameClip"><rect x="16" y="16" width="1368" height="1208" rx="18"/></clipPath>
      </defs>

      <!-- frame + grid (always visible) -->
      <rect x="16" y="16" width="1368" height="1208" rx="18" fill="url(#frameFill)" stroke="var(--panel-edge)" stroke-width="1.4"/>
      <g clip-path="url(#frameClip)">
        <rect x="16" y="16" width="1368" height="1208" fill="url(#gridFine)"/>
        <rect x="16" y="16" width="1368" height="1208" fill="url(#gridCoarse)"/>
        <ellipse class="central-glow" cx="700" cy="740" rx="620" ry="300"/>
      </g>

      <!-- header (always visible) -->
      <text class="t-title" x="58" y="84">CAMPUS SCHEMATIC · NOT TO SCALE</text>
      <text class="t-stage" x="815" y="84" text-anchor="middle">STAGE <tspan id="stageNum">1</tspan> / 7</text>
      <g id="progress">
        <rect class="dash" x="1032" y="70" width="34" height="8" rx="4"/>
        <rect class="dash" x="1075" y="70" width="34" height="8" rx="4"/>
        <rect class="dash" x="1118" y="70" width="34" height="8" rx="4"/>
        <rect class="dash" x="1161" y="70" width="34" height="8" rx="4"/>
        <rect class="dash" x="1204" y="70" width="34" height="8" rx="4"/>
        <rect class="dash" x="1247" y="70" width="34" height="8" rx="4"/>
        <rect class="dash" x="1290" y="70" width="34" height="8" rx="4"/>
      </g>

      <!-- ================= CAMPUS PERIMETER (from stage 2) ================= -->
      <g class="rv" data-from="2">
        <rect id="perim" class="perim" x="88" y="650" width="1224" height="452" rx="16"/>
        <rect x="108" y="648" width="168" height="16" fill="#070f1c"/>
        <text class="t-perim" x="118" y="660">CAMPUS PERIMETER</text>
      </g>

      <!-- ================= CONDUCTORS ================= -->
      <!-- power: utility -> substation -->
      <g class="wire pw rv" data-from="2">
        <path class="base" d="M255 302 V372"/>
        <path class="flow" pathLength="100" d="M255 302 V372"/>
      </g>
      <!-- power bus: substation -> bus -> spread -->
      <g class="wire pw rv" data-from="2">
        <path class="base" d="M255 484 V560 H1090"/>
        <path class="flow"    pathLength="100" d="M255 484 V560 H1090"/>
        <path class="flow d2" pathLength="100" d="M255 484 V560 H1090"/>
      </g>
      <!-- cooling: cooling -> headers -->
      <g class="wire cl rv" data-from="2">
        <path class="base" d="M1147 302 V372"/>
        <path class="flow" pathLength="100" d="M1147 302 V372"/>
      </g>
      <!-- cooling header: headers -> header bus -> spread left -->
      <g class="wire cl rv" data-from="2">
        <path class="base" d="M1147 484 V605 H305"/>
        <path class="flow"    pathLength="100" d="M1147 484 V605 H305"/>
        <path class="flow d2" pathLength="100" d="M1147 484 V605 H305"/>
      </g>

      <!-- pod power drops -->
      <g class="wire pw rv" data-from="2"><path class="base" d="M372 560 V690"/><path class="flow" pathLength="100" d="M372 560 V690"/></g>
      <g class="wire pw rv" data-from="3"><path class="base" d="M771 560 V690"/><path class="flow" pathLength="100" d="M771 560 V690"/></g>
      <g class="wire pw rv" data-from="4"><path class="base" d="M1080 560 V690"/><path class="flow" pathLength="100" d="M1080 560 V690"/></g>
      <!-- pod cooling drops -->
      <g class="wire cl rv" data-from="2"><path class="base" d="M305 605 V690"/><path class="flow" pathLength="100" d="M305 605 V690"/></g>
      <g class="wire cl rv" data-from="3"><path class="base" d="M704 605 V690"/><path class="flow" pathLength="100" d="M704 605 V690"/></g>
      <g class="wire cl rv" data-from="4"><path class="base" d="M1120 605 V690"/><path class="flow" pathLength="100" d="M1120 605 V690"/></g>

      <!-- network fabric (from stage 6) -->
      <g class="wire nt rv" data-from="6"><path class="base" d="M190 941 H1210"/><path class="flow" pathLength="100" d="M190 941 H1210"/><path class="flow d2" pathLength="100" d="M190 941 H1210"/></g>
      <g class="wire nt rv" data-from="6"><path class="base" d="M301 882 V912"/><path class="flow" pathLength="100" d="M301 882 V912"/></g>
      <g class="wire nt rv" data-from="6"><path class="base" d="M700 882 V912"/><path class="flow" pathLength="100" d="M700 882 V912"/></g>
      <g class="wire nt rv" data-from="6"><path class="base" d="M1099 882 V912"/><path class="flow" pathLength="100" d="M1099 882 V912"/></g>

      <!-- bus labels -->
      <text class="t-buslabel rv" data-from="2" x="288" y="542" fill="var(--power)">POWER BUS</text>
      <text class="t-buslabel rv" data-from="2" x="905" y="632" fill="var(--cool)">COOLING HEADER</text>

      <!-- ================= JUNCTION NODES ================= -->
      <!-- power bus nodes -->
      <g class="node pw rv" data-from="2" style="transform:translate(255px,560px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <g class="node pw rv" data-from="2" style="transform:translate(372px,560px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <g class="node pw rv" data-from="3" style="transform:translate(771px,560px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <g class="node pw rv" data-from="4" style="transform:translate(1080px,560px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <!-- cooling header nodes -->
      <g class="node cl rv" data-from="2" style="transform:translate(1147px,605px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <g class="node cl rv" data-from="2" style="transform:translate(305px,605px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <g class="node cl rv" data-from="3" style="transform:translate(704px,605px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <g class="node cl rv" data-from="4" style="transform:translate(1120px,605px)"><circle class="halo" r="8"/><circle class="core" r="4.5"/></g>
      <!-- connector nodes -->
      <g class="node pw rv" data-from="2" style="transform:translate(255px,337px)"><circle class="halo" r="7"/><circle class="core" r="4"/></g>
      <g class="node cl rv" data-from="2" style="transform:translate(1147px,337px)"><circle class="halo" r="7"/><circle class="core" r="4"/></g>

      <!-- ================= TOP CARDS ================= -->
      <!-- UTILITY -->
      <g class="card pw rv lift" data-from="2">
        <rect class="card-bg" x="95" y="190" width="315" height="112" rx="12"/>
        <rect class="card-inner" x="99" y="194" width="307" height="104" rx="9"/>
        <rect class="icon-box pw" x="117" y="223" width="46" height="46" rx="9"/>
        <path class="g-pw-fill" d="M143 231 L131 251 H140 L137 265 L150 244 H141 Z"/>
        <text class="t-cardtitle" x="179" y="240">UTILITY</text>
        <text class="t-cardsub" x="179" y="266">INTERCONNECT</text>
        <rect x="332" y="228" width="48" height="4" rx="2" fill="var(--power)"/>
        <rect x="332" y="240" width="48" height="4" rx="2" fill="var(--power)" opacity=".4"/>
      </g>
      <!-- CONTROL PLANE -->
      <g class="card rv lift" data-from="2">
        <rect class="card-bg" x="543" y="190" width="315" height="112" rx="12"/>
        <rect class="card-inner" x="547" y="194" width="307" height="104" rx="9"/>
        <rect class="icon-box pw" x="565" y="223" width="46" height="46" rx="9"/>
        <g transform="translate(565,223)">
          <rect class="g-pw" x="12" y="12" width="22" height="6.5" rx="2"/>
          <rect class="g-pw" x="12" y="22" width="22" height="6.5" rx="2"/>
          <rect class="g-pw" x="12" y="32" width="22" height="6.5" rx="2"/>
          <circle class="g-pw-fill" cx="16" cy="15.2" r="1.5"/>
          <circle class="g-pw-fill" cx="16" cy="25.2" r="1.5"/>
          <circle class="g-pw-fill" cx="16" cy="35.2" r="1.5"/>
        </g>
        <text class="t-cardtitle" x="627" y="240">CONTROL PLANE</text>
        <text class="t-cardsub" x="627" y="266">ONE PER CAMPUS</text>
      </g>
      <!-- COOLING -->
      <g class="card cl rv lift" data-from="2">
        <rect class="card-bg" x="990" y="190" width="315" height="112" rx="12"/>
        <rect class="card-inner" x="994" y="194" width="307" height="104" rx="9"/>
        <rect class="icon-box cl" x="1012" y="223" width="46" height="46" rx="9"/>
        <g transform="translate(1012,223)">
          <circle class="g-cl" cx="23" cy="23" r="14.5"/>
          <circle class="g-cl" cx="23" cy="23" r="2.6" fill="var(--cool)"/>
          <path class="g-cl" d="M23 22 C18 22 15.5 17 18.5 12.8 C21.5 15 23 18 23 22 Z" transform="rotate(0 23 23)"/>
          <path class="g-cl" d="M23 22 C18 22 15.5 17 18.5 12.8 C21.5 15 23 18 23 22 Z" transform="rotate(120 23 23)"/>
          <path class="g-cl" d="M23 22 C18 22 15.5 17 18.5 12.8 C21.5 15 23 18 23 22 Z" transform="rotate(240 23 23)"/>
        </g>
        <text class="t-cardtitle" x="1074" y="240">COOLING</text>
        <text class="t-cardsub" x="1074" y="266">PLANT + HEADERS</text>
        <rect x="1227" y="228" width="48" height="3" rx="1.5" fill="var(--ink-mute)" opacity=".7"/>
        <rect x="1227" y="238" width="48" height="3" rx="1.5" fill="var(--ink-mute)" opacity=".7"/>
      </g>

<script>
(function(){
  "use strict";
  var TOTAL = 7;

  // Replace these with your original stage captions from the source HTML.
  var CAPTIONS = {
    1: "Pod 01 is built and energized first — revenue before the campus is finished.",
    2: "Utility, substation, cooling and control plane are sized for the full campus.",
    3: "Pod 02 drops onto the same power bus and cooling header. Same design, repeated.",
    4: "Pod 03 follows the same design. No redesign, no second permitting cycle.",
    5: "One network skid serves up to five IT pods and ties them together.",
    6: "The pods resolve into a single network fabric — one campus, one control plane.",
    7: "Modular campus — expandable to Pods 04–06 and beyond without redesign."
  };

  var svg      = document.getElementById('schematic');
  var stageNum = document.getElementById('stageNum');
  var capText  = document.getElementById('capText');
  var perim    = document.getElementById('perim');
  var dashes   = Array.prototype.slice.call(svg.querySelectorAll('.dash'));
  var rvEls    = Array.prototype.slice.call(svg.querySelectorAll('[data-from]'));
  var playIcon = document.getElementById('playIcon');
  var playLabel= document.getElementById('playLabel');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // build stage dots
  var dotsWrap = document.getElementById('dots');
  var dots = [];
  for (var i=1; i<=TOTAL; i++){
    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', 'Stage ' + i);
    (function(n){ d.addEventListener('click', function(){ pause(); setStage(n); }); })(i);
    dotsWrap.appendChild(d);
    dots.push(d);
  }

  var stage = 0, timer = null, playing = false, started = false;

  var PLAY  = '<path d="M7 5v14l11-7z"/>';
  var PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function reflectPlay(){
    playIcon.innerHTML = playing ? PAUSE : PLAY;
    playLabel.textContent = playing ? 'Pause' : 'Play';
  }

  function setStage(n){
    stage = Math.max(1, Math.min(TOTAL, n));
    svg.setAttribute('data-stage', stage);
    for (var i=0;i<rvEls.length;i++){
      var from = parseInt(rvEls[i].getAttribute('data-from'), 10);
      rvEls[i].classList.toggle('is-on', stage >= from);
    }
    for (var j=0;j<dashes.length;j++) dashes[j].classList.toggle('lit', j < stage);
    for (var k=0;k<dots.length;k++) dots[k].classList.toggle('active', k === stage-1);
    if (perim) perim.classList.toggle('emph', stage >= 7);
    stageNum.textContent = stage;
    capText.textContent = CAPTIONS[stage] || '';
  }

  function next(){ if (stage < TOTAL) setStage(stage+1); else stopAuto(); }
  function startAuto(){
    stopAuto();
    playing = true; reflectPlay();
    timer = setInterval(function(){
      if (stage >= TOTAL){ stopAuto(); } else { next(); }
    }, 2600);
  }
  function stopAuto(){ if (timer){ clearInterval(timer); timer = null; } playing = false; reflectPlay(); }
  function pause(){ stopAuto(); }

  // control wiring
  document.getElementById('prevBtn').addEventListener('click', function(){ pause(); setStage(stage-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ pause(); setStage(stage+1); });
  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing){ stopAuto(); }
    else { if (stage >= TOTAL) setStage(1); startAuto(); }
  });
  document.getElementById('replayBtn').addEventListener('click', function(){ setStage(1); if(!reduce) startAuto(); else stopAuto(); });

  svg.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ pause(); setStage(stage+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ pause(); setStage(stage-1); e.preventDefault(); }
  });

  // initial state
  if (reduce){ setStage(TOTAL); }   // show full campus statically
  else { setStage(1); }             // never blank; sequence begins on view

  // start the build sequence once the model scrolls into view
  if (!reduce && 'IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      for (var i=0;i<entries.length;i++){
        if (entries[i].isIntersecting && !started){
          started = true;
          setStage(1);
          startAuto();
          io.disconnect();
        }
      }
    }, { threshold: 0.3 });
    io.observe(svg);
  } else if (!reduce){
    started = true; startAuto();
  }
})();
</script>
